<!doctype html>
<html><head>
<meta property="og:title" content="Weeknight Chili - Example Blog">
<meta property="og:image" content="https://example.com/chili.jpg">
</head><body>
<div class="wprm-recipe-container">
  <div class="wprm-recipe">
    <h2 class="wprm-recipe-name">Weeknight Chili</h2>
    <span class="wprm-recipe-servings">6</span>
    <div class="wprm-recipe-ingredient-group">
      <h4 class="wprm-recipe-group-name">Chili</h4>
      <ul>
        <li class="wprm-recipe-ingredient">1 lb ground beef</li>
        <li class="wprm-recipe-ingredient">1 can kidney beans</li>
      </ul>
    </div>
    <div class="wprm-recipe-ingredient-group">
      <h4 class="wprm-recipe-group-name">Toppings</h4>
      <ul><li class="wprm-recipe-ingredient">Sour cream</li></ul>
    </div>
    <div class="wprm-recipe-instruction-group">
      <ul>
        <li><div class="wprm-recipe-instruction-text">Brown the beef.</div></li>
        <li><div class="wprm-recipe-instruction-text">Add beans and simmer 20 minutes.</div></li>
      </ul>
    </div>
  </div>
</div>
</body></html>
