# Dependency automation (DESIGN 12.2 control 9, M7). Weekly and grouped, so updates arrive as a few pull requests
# instead of one per library; CI must pass before merging. Security updates (a repository setting, docs/RUNBOOK.md)
# are not delayed by the schedule. Actions are pinned to commit SHAs with the version in a comment; Dependabot
# updates both.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # AGP 9.5.0 and 9.5.1 cannot configure release variants: their Compose Preview task needs unit tests there
      # (DECISIONS 2026-10-31, 2026-11-14). Later AGP versions are proposed again.
      - dependency-name: "com.android.*"
        versions: ["9.5.0", "9.5.1"]
    groups:
      androidx-and-compose:
        patterns: ["androidx.*", "org.jetbrains.compose*"]
      firebase-and-google:
        patterns: ["com.google.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*", "com.diffplug*"]
      testing:
        patterns: ["junit*", "io.mockk*", "app.cash.turbine*", "org.robolectric*", "io.github.takahirom*"]
      other-libraries:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /firebase
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      firebase-tools-and-sdk:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend/reminder
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    ignore:
      # The job runs on Node 24 (package.json engines, workflows): types for a newer Node would allow code that
      # fails at runtime. Raise this together with the Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      reminder-job:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    ignore:
      # Node 24 runs the scripts (package.json engines, ci.yml), as for the reminder job.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 (DECISIONS 2026-10-29); raise both together.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web-app:
        patterns: ["*"]

  # The theme generator (DESIGN 6.4) runs only when the themes change, but its lockfile gets updates too.
  - package-ecosystem: npm
    directory: /tools/themes
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 1
    ignore:
      # 0.4.0 has a broken ESM import (DECISIONS 2026-10-15); later versions are proposed again.
      - dependency-name: "@material/material-color-utilities"
        versions: ["0.4.0"]
    groups:
      theme-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      actions:
        patterns: ["*"]
