name: expiry-reminders

# DESIGN 10.4: three entries an hour, off the busy top of the hour. GitHub starts scheduled runs late or drops
# many of them (about 5 of 24 a day in October 2026), so more entries make a gap less likely. The job catches up
# until 22:00 local time and sends at most one digest a day per user, however many runs start; the first run of
# each UTC day also prunes (jobs/state.lastPruneDate).
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be sent and change nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    # One run per Firebase project. A project whose secret is missing logs "nothing to do".
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: spoilnot-prod
            secret: FIREBASE_SERVICE_ACCOUNT_JSON
          - project: spoilnot-dev
            secret: FIREBASE_SERVICE_ACCOUNT_JSON_DEV
    name: send (${{ matrix.project }})
    concurrency:
      group: expiry-reminders-${{ matrix.project }}
      cancel-in-progress: false

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/reminder/package-lock.json
      - name: Run the reminder job
        working-directory: backend/reminder
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.secret] }}
          EXPECTED_PROJECT: ${{ matrix.project }}
          # Scheduled runs are live; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: npm ci && npm run build && node dist/main.js
