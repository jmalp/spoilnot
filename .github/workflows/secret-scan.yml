name: secret-scan

# DESIGN 12.2 control 8: next to GitHub's own secret scanning and push protection (repository settings), gitleaks
# checks every push and pull request, and the whole history weekly. Config: .gitleaks.toml.
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Findings appear (redacted) in the job log only: no PR comment, no summary, no SARIF artifact copying them.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
