name: secret-scan

# DESIGN 12.2 control 8: GitHub's own secret scanning is not available for this private repository on the free
# plan, so gitleaks checks every push and pull request, and the whole history weekly. Config: .gitleaks.toml.
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Findings appear (redacted) in the job log only: no PR comment, no summary, no SARIF artifact copying them.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
