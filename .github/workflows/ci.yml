name: ci

on:
  pull_request:
    paths: &paths
      - 'app/**'
      - 'benchmark/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.editorconfig'
      - 'firebase/**'
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

# Free private-repo minutes are limited (DESIGN 13.2): cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Format, lint, unit tests, build both flavors, compile the benchmarks
        run: ./gradlew spotlessCheck lintDevDebug testDevDebugUnitTest assembleDebug :benchmark:compileBenchmarkKotlin
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: app/build/reports/
          retention-days: 7

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Rules tests against the Firestore emulator
        run: npm test

  reminder-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            backend/reminder/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - name: Typecheck, unit tests, build
        working-directory: backend/reminder
        run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run build
      - name: Integration test against the Firestore emulator
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-spoilnot --only firestore "npm --prefix ../backend/reminder run test:integration"

  # The web app for iPhone (DESIGN 18). It also runs on Android changes: the web words, colors and icons are
  # generated from the app's resources, so a changed strings.xml or theme must be regenerated in the same PR.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            firebase/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - name: Generated strings, colors and icons match the Android app
        run: npm run gen:check
      - name: Format, lint, types, unit tests, build
        run: npm run check
      - name: Browser tests in WebKit against the emulators (screenshots are compared locally, DESIGN 18.7), then the build under the hosting headers (18.6)
        run: |
          npx playwright install --with-deps webkit
          cd ../firebase && npx firebase emulators:exec --project demo-spoilnot --only auth,firestore \
            "cd ../web && npx playwright test && npx playwright test -c playwright.preview.config.ts"
      - name: Upload the browser test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-report
          path: |
            web/playwright-report/
            web/playwright-report-preview/
          retention-days: 7
