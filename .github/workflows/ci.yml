name: ci

on:
  pull_request:
    paths: &paths
      - 'app/**'
      - 'benchmark/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.editorconfig'
      - 'firebase/**'
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

# A newer push makes the older run pointless (DESIGN 13.2): cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which jobs a change needs (after v1, review EFF-08, DESIGN 13.2): each job runs only when its files changed. A
  # run started by hand, or one whose base can't be fetched, runs them all. The web job also runs on the Android
  # strings, icons and theme its generated files come from; the reminder job on firebase/, whose emulator it uses.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      firestore-rules: ${{ steps.filter.outputs.firestore-rules }}
      reminder-job: ${{ steps.filter.outputs.reminder-job }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          declare -A paths=(
            [android]='^(app/|benchmark/|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$|gradlew$|\.editorconfig$)'
            [firestore-rules]='^firebase/'
            [reminder-job]='^(backend/|firebase/)'
            [web]='^(web/|firebase/|app/src/main/res/|app/src/main/kotlin/com/parcha/spoilnot/core/designsystem/theme/)'
          )
          all=false
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git fetch --quiet --depth=1 origin "$BASE"; then
            all=true
          else
            files=$(git diff --name-only "$BASE" HEAD)
            # A change to this workflow runs every job.
            if grep -qx '.github/workflows/ci.yml' <<<"$files"; then all=true; fi
          fi
          for job in "${!paths[@]}"; do
            run=$all
            if [ "$all" = false ] && grep -qE "${paths[$job]}" <<<"$files"; then run=true; fi
            echo "$job=$run" | tee -a "$GITHUB_OUTPUT"
          done

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The instrumented tests and the benchmarks need a device and run on the Mac (CLAUDE.md); CI compiles them so a
      # change that breaks them fails here (after v1, 2026-11-22).
      - name: Format, lint, unit tests, build both flavors, compile the instrumented tests and the benchmarks
        run: >-
          ./gradlew spotlessCheck lintDevDebug testDevDebugUnitTest assembleDebug compileDevDebugAndroidTestKotlin
          :benchmark:compileBenchmarkKotlin
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: app/build/reports/
          retention-days: 7

  firestore-rules:
    needs: changes
    if: needs.changes.outputs.firestore-rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Rules tests against the Firestore emulator
        run: npm test

  reminder-job:
    needs: changes
    if: needs.changes.outputs.reminder-job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            backend/reminder/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - name: Typecheck, unit tests, build
        working-directory: backend/reminder
        run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run build
      - name: Integration test against the Firestore emulator
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-spoilnot --only firestore "npm --prefix ../backend/reminder run test:integration"

  # The web app for iPhone (DESIGN 18). It also runs on Android changes: the web words, colors and icons are
  # generated from the app's resources, so a changed strings.xml or theme must be regenerated in the same PR.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WebKit and its system libraries come with Playwright's image instead of being installed on every run (after
    # v1, review EFF-08). Its version follows web/package.json's @playwright/test by hand (Dependabot doesn't update
    # images); the browser step warns when they differ.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-resolute@sha256:dcf385f7a31aa1cbb0a7a0c97a539142bf70480b661f89f26a774ec1fe2edd1d
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            firebase/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      # The container runs as root and the checkout belongs to the runner's user, so git (gen:check's diff) refuses it
      # unless it is marked safe; checkout marks it only in its own temporary config.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - name: Generated strings, colors and icons match the Android app
        run: npm run gen:check
      - name: Format, lint, types, unit tests, build
        run: npm run check
      - name: Browser tests in WebKit against the emulators (screenshots are compared locally, DESIGN 18.7), then the build under the hosting headers (18.6)
        run: |
          image=1.65.1 package=$(node -p "require('@playwright/test/package.json').version")
          if [ "$image" != "$package" ]; then
            echo "::warning::@playwright/test is $package but the image is $image: update the web job's image"
            npx playwright install --with-deps webkit
          fi
          cd ../firebase && npx firebase emulators:exec --project demo-spoilnot --only auth,firestore \
            "cd ../web && npx playwright test && npx playwright test -c playwright.preview.config.ts"
      - name: Upload the browser test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-report
          path: |
            web/playwright-report/
            web/playwright-report-preview/
          retention-days: 7
