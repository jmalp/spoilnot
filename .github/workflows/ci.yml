name: ci

on:
  pull_request:
    paths: &paths
      - 'app/**'
      - 'benchmark/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.editorconfig'
      - 'firebase/**'
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

# Free private-repo minutes are limited (DESIGN 13.2): cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Format, lint, unit tests, build both flavors, compile the benchmarks
        run: ./gradlew spotlessCheck lintDevDebug testDevDebugUnitTest assembleDebug :benchmark:compileBenchmarkKotlin
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: app/build/reports/
          retention-days: 7

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - name: Rules tests against the Firestore emulator
        run: npm test

  reminder-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            backend/reminder/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
        working-directory: firebase
      - name: Typecheck, unit tests, build
        working-directory: backend/reminder
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Integration test against the Firestore emulator
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-spoilnot --only firestore "npm --prefix ../backend/reminder run test:integration"

  # The web app for iPhone (DESIGN 18). It also runs on Android changes: the web words, colors and icons are
  # generated from the app's resources, so a changed strings.xml or theme must be regenerated in the same PR.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated strings, colors and icons match the Android app
        run: npm run gen:check
      - name: Format, lint, types, unit tests, build
        run: npm run check
      - name: Browser tests in WebKit (screenshots are compared locally, DESIGN 18.7)
        run: npx playwright install --with-deps webkit && npx playwright test
      - name: Upload the browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-report
          path: web/playwright-report/
          retention-days: 7
