name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without activity, which would stop the
# reminders and the nightly export without warning. Once a month this re-enables them through the API, which
# resets that clock (docs/RUNBOOK.md, "Scheduled workflows").
on:
  schedule:
    - cron: '41 5 3 * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in reminders.yml nightly-export.yml secret-scan.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow/enable"
            echo "enabled $workflow"
          done
