name: nightly-export

# DESIGN 13.4 (M7): every night, each household's data as JSON (the app's export format), kept as an Actions
# artifact for 14 days. Read-only. Restore with the restore workflow (docs/RUNBOOK.md).
# The repository is public, so anyone signed in to GitHub can download artifacts: the exports are encrypted with
# the EXPORT_ENCRYPTION_KEY secret (AES-256, PBKDF2) and the job refuses to upload them unencrypted.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-export
  cancel-in-progress: false

permissions:
  contents: read
  # Workload identity (DESIGN 12.2 control 8): lets the job ask GitHub for an OIDC token for this run, which Google
  # exchanges for the read-only export-job service account. Unused until the repository variables are set.
  id-token: write

jobs:
  export:
    # The keys are repository secrets and the workload identity settings repository variables; this environment holds
    # none and lists the runs as deployments (DESIGN 12.2 control 8, DECISIONS 2026-11-22).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `shell: bash` runs each step with -eo pipefail, so a step fails when any command in a pipe fails (a tar that
    # stops half-way must not leave an encrypted, truncated archive). GitHub's default for `run` has no pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/reminder/package-lock.json
      # Install and build without secrets, without packages' install scripts and without the means to ask for an OIDC
      # token; only the next step can sign in.
      - name: Install and build
        working-directory: backend/reminder
        run: unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN && npm ci --ignore-scripts && npm run build
      - name: Export every household
        working-directory: backend/reminder
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SA_EXPORT }}
          # A key only while workload identity isn't set up: the export's own (read-only) when stored, else the
          # reminder job's (docs/RUNBOOK.md, "How the jobs get their keys").
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ (!vars.GCP_WORKLOAD_IDENTITY_PROVIDER || !vars.GCP_SA_EXPORT) && (secrets.FIREBASE_SERVICE_ACCOUNT_JSON_EXPORT || secrets.FIREBASE_SERVICE_ACCOUNT_JSON) || '' }}
          EXPECTED_PROJECT: spoilnot-prod
          EXPORT_DIR: ${{ runner.temp }}/exports
        run: node dist/export-main.js
      - name: Encrypt
        env:
          EXPORT_ENCRYPTION_KEY: ${{ secrets.EXPORT_ENCRYPTION_KEY }}
          EXPORT_DIR: ${{ runner.temp }}/exports
        run: |
          if [ -z "$(ls -A "$EXPORT_DIR" 2>/dev/null)" ]; then echo "Nothing exported."; exit 0; fi
          if [ -z "$EXPORT_ENCRYPTION_KEY" ]; then
            rm -rf "$EXPORT_DIR"
            echo "::error::EXPORT_ENCRYPTION_KEY is not set; refusing to upload unencrypted exports (docs/RUNBOOK.md)."
            exit 1
          fi
          tar -C "$EXPORT_DIR" -czf - . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:EXPORT_ENCRYPTION_KEY \
                -out "$RUNNER_TEMP/household-exports.tar.gz.enc"
          rm -rf "$EXPORT_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: household-exports
          path: ${{ runner.temp }}/household-exports.tar.gz.enc
          retention-days: 14
          if-no-files-found: ignore
