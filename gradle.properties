org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# Screenshot file names in tests are relative to roborazzi.outputDir (app/build.gradle.kts).
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
# References at half the device's pixels: about a quarter of the size, still showing every layout change (DECISIONS).
roborazzi.record.resizeScale=0.5
